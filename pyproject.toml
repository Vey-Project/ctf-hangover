[project]
name = "ctf-hangover"
version = "0.1.0"
description = "Autonomous CTF solver powered by 9Router — multi-model race, smart routing, self-play, auto-decompose."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "click>=8.1",
    "rich>=13.7",
    "docker>=7.1",
    "openai>=1.40",
    "anyio>=4.4",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "aiohttp>=3.9",
]

[project.scripts]
ctf-solve = "ctf_hangover.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctf_hangover"]
